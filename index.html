<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b35"><title>MarketHub · Market management</title>
<style>
:root{--ink:#18332e;--muted:#687b75;--brand:#155b4d;--mint:#e7f2ed;--paper:#f5f7f4;--line:#dce5df;--white:#fff;--gold:#f4c66a;--red:#a83d36}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{background:#123b35;color:white;padding:16px max(18px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:21px;letter-spacing:-.5px}.brand span{color:#9ed3b9}.top small{color:#c6d9d1}.shell{max-width:1180px;margin:auto;padding:22px 18px 60px}.welcome{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.welcome h1{font-size:27px;line-height:1.15;margin:0 0 5px}.muted{color:var(--muted)}.role{border:1px solid #b9ccc2;background:white;border-radius:999px;padding:9px 12px;color:var(--brand);font-weight:700}.nav{display:flex;gap:7px;overflow:auto;padding:4px 0 15px;margin-bottom:12px}.nav button{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--muted);border-radius:10px;padding:9px 13px}.nav button.active{background:var(--brand);color:white;border-color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 3px 12px #163c3010}.stat strong{font-size:27px;display:block;line-height:1.2}.stat span{color:var(--muted);font-size:13px}.panel{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.card h2{font-size:17px;margin:0 0 12px}.card h3{font-size:15px;margin:0 0 7px}.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}.item:first-of-type{border-top:0}.pill{font-size:12px;font-weight:700;border-radius:99px;padding:4px 9px;background:var(--mint);color:var(--brand);white-space:nowrap}.pill.pending{background:#fff3d9;color:#815b16}.pill.cancelled{background:#fbe9e7;color:var(--red)}.btn{border:0;border-radius:9px;background:var(--brand);color:white;padding:9px 13px;font-weight:700}.btn.secondary{background:var(--mint);color:var(--brand)}.btn.danger{background:#fbe9e7;color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:7px;flex-wrap:wrap}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:13px;font-weight:650;color:var(--muted)}input,select{border:1px solid #cbd8d0;border-radius:9px;padding:10px;background:white;color:var(--ink);min-width:0;width:100%}.wide{grid-column:1/-1}.empty{color:var(--muted);padding:12px 0}.notice{background:#fff7e6;border:1px solid #f0dfb7;border-radius:12px;padding:12px;color:#6d531e;font-size:13px;margin-top:14px}.hidden{display:none!important}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-head h2{margin:0}.small{font-size:13px}.footer{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.panel{grid-template-columns:1fr}.welcome{align-items:flex-start;flex-direction:column}.welcome h1{font-size:24px}.shell{padding:18px 13px 45px}.top{padding:13px}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head>
<body>
<header class="top"><div><div class="brand">Market<span>Hub</span></div><small>Market operations, made simpler</small></div><div class="small" id="modeLabel">Administrator view</div></header>
<main class="shell">
<div class="welcome"><div><h1 id="greeting">Good morning</h1><div class="muted">Your market overview at a glance.</div></div><button class="role" id="switchRole">Switch to trader view ↗</button></div>
<nav class="nav" id="nav"></nav><section id="content"></section>
<div class="footer">MarketHub prototype · Demo data is stored in this browser only.</div>
</main>
<script>
const seed={pitches:[{id:1,name:"Food 1",area:"Warepoint",price:35},{id:2,name:"Food 1",area:"Newcastle",price:35},{id:3,name:"Food 2",area:"Newcastle",price:35},{id:4,name:"Food 3",area:"Newcastle",price:35},{id:5,name:"Food 4",area:"Newcastle",price:35},{id:6,name:"Food 5",area:"Newcastle",price:35},{id:7,name:"Coffee 1",area:"Newcastle",price:35},{id:8,name:"Coffee 2",area:"Newcastle",price:35},{id:9,name:"Food 1",area:"Downpatrick",price:35},{id:10,name:"Food 2",area:"Downpatrick",price:35},{id:11,name:"Food 3",area:"Downpatrick",price:35},{id:12,name:"Food 4",area:"Downpatrick",price:35},{id:13,name:"Food 5",area:"Downpatrick",price:35},{id:14,name:"Coffee 1",area:"Downpatrick",price:35},{id:15,name:"Coffee 2",area:"Downpatrick",price:35}],traders:["Harbour Bakes","Mourne Crafts","Green Leaf Produce"],bookings:[],events:[{id:101,name:"Newcastle Market",date:nextDate(7),location:"Newcastle",status:"Scheduled"},{id:102,name:"Downpatrick Market",date:nextDate(10),location:"Downpatrick",status:"Scheduled"}],payments:[{id:1,trader:"Harbour Bakes",amount:35,status:"Paid"},{id:2,trader:"Mourne Crafts",amount:35,status:"Due"},{id:3,trader:"Green Leaf Produce",amount:35,status:"Due"}],compliance:[{trader:"Harbour Bakes",item:"Public liability insurance",status:"Received"},{trader:"Mourne Crafts",item:"Risk assessment",status:"Outstanding"},{trader:"Green Leaf Produce",item:"Food business registration",status:"Received"}]};
function nextDate(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
let data;try{data=JSON.parse(localStorage.getItem("markethub-demo"))||seed}catch{data=seed}
let role="admin",tab="dashboard";const tabs=[["dashboard","Overview"],["bookings","Bookings"],["events","Events"],["pitches","Locations & pitches"],["traders","Traders"],["payments","Payments"],["compliance","Compliance"],["safety","Safety & updates"]];
const $=s=>document.querySelector(s);function save(){localStorage.setItem("markethub-demo",JSON.stringify(data));render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pitch(id){return data.pitches.find(p=>p.id===Number(id))}
function badge(s){return '<span class="pill '+(s==="Pending"||s==="Due"||s==="Outstanding"?"pending":s==="Cancelled"?"cancelled":"")+'">'+esc(s)+'</span>'}
function nav(){let visible=role==="admin"?tabs:[["dashboard","Overview"],["bookings","Apply for a pitch"],["payments","My payments"],["compliance","My compliance"],["safety","Safety & updates"]];$("#nav").innerHTML=visible.map(([id,label])=>'<button class="'+(tab===id?'active':'')+'" data-tab="'+id+'">'+label+'</button>').join("");$("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function stats(){return '<div class="grid"><div class="card stat"><strong>'+data.bookings.length+'</strong><span>Pitch applications</span></div><div class="card stat"><strong>'+data.bookings.filter(b=>b.status==="Pending").length+'</strong><span>Awaiting approval</span></div><div class="card stat"><strong>'+data.events.filter(e=>e.status==="Scheduled").length+'</strong><span>Upcoming markets</span></div><div class="card stat"><strong>£'+data.payments.filter(p=>p.status==="Due").reduce((a,p)=>a+p.amount,0)+'</strong><span>Payments due</span></div></div>'}
function bookingRows(){let rows=data.bookings.filter(b=>role==="admin"||b.trader==="Harbour Bakes");return rows.length?rows.map(b=>'<div class="item"><div><b>'+esc(b.trader)+'</b><div class="small muted">'+esc(b.date)+' · '+esc(pitch(b.pitch)?.name||"Pitch removed")+'</div></div><div class="actions">'+badge(b.status)+(role==="admin"&&b.status==="Pending"?'<button class="btn" data-approve="'+b.id+'">Approve</button>':"")+'</div></div>').join(""):'<div class="empty">No applications yet.</div>'}
function dashboard(){return stats()+'<div class="panel"><div class="card"><div class="section-head"><h2>Recent pitch applications</h2><button class="btn secondary" data-go="bookings">View all</button></div>'+bookingRows()+'</div><div class="card"><h2>Next market</h2>'+data.events.filter(e=>e.status==="Scheduled").slice(0,2).map(e=>'<div class="item"><div><b>'+esc(e.name)+'</b><div class="small muted">'+esc(e.date)+' · '+esc(e.location)+'</div></div>'+badge(e.status)+'</div>').join("")+'<div class="notice">Weather and council notices are integration placeholders. Connect approved data feeds before relying on live alerts.</div></div></div>'}
function bookings(){return '<div class="card"><div class="section-head"><h2>'+(role==="admin"?"Weekly pitch applications":"Apply for a pitch")+'</h2></div>'+(role==="trader"?'<form id="applyForm" class="form"><div class="field"><label>Market date</label><input type="date" name="date" min="'+nextDate(0)+'" required></div><div class="field"><label>Trader / business</label><select name="trader"><option>Harbour Bakes</option><option>Mourne Crafts</option><option>Green Leaf Produce</option></select></div><div class="field wide"><label>Preferred available pitch</label><select name="pitch">'+data.pitches.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+esc(p.area)+' · £'+p.price+'</option>').join("")+'</select></div><div class="wide"><button class="btn">Submit for approval</button></div></form><p class="small muted">Your pitch is not confirmed until an administrator approves it.</p>':'')+bookingRows()+'</div>'}
function events(){return '<div class="card"><h2>Market events</h2>'+data.events.map(e=>'<div class="item"><div><b>'+esc(e.name)+'</b><div class="small muted">'+esc(e.date)+' · '+esc(e.location)+'</div></div><div class="actions">'+badge(e.status)+(role==="admin"&&e.status==="Scheduled"?'<button class="btn danger" data-cancel="'+e.id+'">Cancel & notify</button>':'')+'</div></div>').join("")+(role==="admin"?'<form id="eventForm" class="form"><div class="field"><label>Event name</label><input name="name" required></div><div class="field"><label>Date</label><input type="date" name="date" required></div><div class="field wide"><label>Location</label><input name="location" required></div><div class="wide"><button class="btn">Add market event</button></div></form>':'')+'</div>'}
function pitches(){return '<div class="card"><h2>Locations & pitches</h2>'+data.pitches.map(p=>'<div class="item"><div><b>'+esc(p.name)+'</b><div class="small muted">'+esc(p.area)+' · £'+p.price+'</div></div>'+ (role==="admin"?'<button class="btn secondary" data-remove-pitch="'+p.id+'">Remove</button>':'')+'</div>').join("")+(role==="admin"?'<form id="pitchForm" class="form"><div class="field"><label>Pitch name</label><input name="name" required></div><div class="field"><label>Location / area</label><input name="area" required></div><div class="field"><label>Weekly price (£)</label><input name="price" type="number" min="0" required></div><div class="wide"><button class="btn">Add pitch</button></div></form>':'')+'</div>'}
function traders(){return '<div class="card"><h2>Trader directory</h2>'+data.traders.map(t=>'<div class="item"><b>'+esc(t)+'</b>'+badge("Registered")+'</div>').join("")+'<p class="small muted">Demo directory. Add account registration and verified contact details in the production backend.</p></div>'}
function payments(){let list=data.payments.filter(p=>role==="admin"||p.trader==="Harbour Bakes");return '<div class="card"><h2>'+(role==="admin"?"Pitch payments":"My payments")+'</h2>'+list.map(p=>'<div class="item"><div><b>'+esc(p.trader)+'</b><div class="small muted">Pitch fee · £'+p.amount+'</div></div><div class="actions">'+badge(p.status)+(role==="admin"&&p.status==="Due"?'<button class="btn secondary" data-paid="'+p.id+'">Mark paid</button>':'')+'</div></div>').join("")+'<div class="notice">Online payment processing is not connected. Do not enter card details in this demo.</div></div>'}
function compliance(){let list=data.compliance.filter(c=>role==="admin"||c.trader==="Harbour Bakes");return '<div class="card"><h2>Trader compliance hub</h2>'+list.map(c=>'<div class="item"><div><b>'+esc(c.trader)+'</b><div class="small muted">'+esc(c.item)+'</div></div>'+badge(c.status)+'</div>').join("")+'<p class="small muted">Production version should support secure document upload, expiry dates and administrator review.</p></div>'}
function safety(){return '<div class="card"><h2>Safety & market updates</h2><div class="item"><div><b>Event safety guidance</b><div class="small muted">Review the Purple Guide and relevant local risk assessments.</div></div><a href="https://www.thepurpleguide.co.uk/" target="_blank" rel="noopener">Open guide ↗</a></div><div class="item"><div><b>Met Office</b><div class="small muted">Weather warnings and forecasts for event planning.</div></div><a href="https://www.metoffice.gov.uk/" target="_blank" rel="noopener">Met Office ↗</a></div><div class="item"><div><b>Newry, Mourne and Down District Council</b><div class="small muted">Council services, notices and local requirements.</div></div><a href="https://www.newrymournedown.org/" target="_blank" rel="noopener">Council website ↗</a></div><div class="notice">Live weather/council feeds and automatic email/SMS notifications still need API credentials, integration work and testing.</div></div>'}
function render(){nav();$("#modeLabel").textContent=role==="admin"?"Administrator view":"Trader view";$("#switchRole").textContent=role==="admin"?"Switch to trader view ↗":"Switch to administrator view ↗";let pages={dashboard,bookings,events,pitches,traders,payments,compliance,safety};$("#content").innerHTML=(role==="trader"&&["events","pitches","traders"].includes(tab)?"":(pages[tab]||dashboard)());wire()}
function wire(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});$("#applyForm")?.addEventListener("submit",e=>{e.preventDefault();let f=new FormData(e.target);let id=Date.now();data.bookings.push({id,trader:f.get("trader"),pitch:Number(f.get("pitch")),date:f.get("date"),status:"Pending"});save()});$("#eventForm")?.addEventListener("submit",e=>{e.preventDefault();let f=new FormData(e.target);data.events.push({id:Date.now(),name:f.get("name"),date:f.get("date"),location:f.get("location"),status:"Scheduled"});save()});$("#pitchForm")?.addEventListener("submit",e=>{e.preventDefault();let f=new FormData(e.target);data.pitches.push({id:Date.now(),name:f.get("name"),area:f.get("area"),price:Number(f.get("price"))});save()});document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{let x=data.bookings.find(x=>x.id===Number(b.dataset.approve));if(x)x.status="Approved";save()});document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{let x=data.events.find(x=>x.id===Number(b.dataset.cancel));if(x&&confirm("Cancel this market? This demo will mark it cancelled. No real notifications are sent.")){x.status="Cancelled";save()}});document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>{let x=data.payments.find(x=>x.id===Number(b.dataset.paid));if(x)x.status="Paid";save()});document.querySelectorAll("[data-remove-pitch]").forEach(b=>b.onclick=()=>{if(confirm("Remove this pitch?")){data.pitches=data.pitches.filter(p=>p.id!==Number(b.dataset.removePitch));save()}})}
$("#switchRole").onclick=()=>{role=role==="admin"?"trader":"admin";tab="dashboard";render()};$("#greeting").textContent="Market overview";render();
</script></body></html>
